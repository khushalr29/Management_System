openapi: 3.0.0
info:
  title: Car Management service 
  description: API documentation for Car Management Service
  version: "1.0.0"
servers:
  - url: /api/v1

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates if the operation was successful"
          example: true
        message:
          type: string
          description: "Message related to the operation"
          example: "Operation successful"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: "Error message"
          example: "Invalid input"

    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Authentication credentials were not provided.
    NotFound:
      description: Resource Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: The requested resource was not found.

    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
          nullable: true
        established_year:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true

    BrandCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Toyota
        country:
          type: string
          example: Japan
        established_year:
          type: integer
          example: 1937

    BrandUpdate:
      type: object
      properties:
        name:
          type: string
        country:
          type: string
        established_year:
          type: integer

paths:
  /brands:
    get:
      summary: List all brands
      tags:
        - Brand
      responses:
        200:
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"

    post:
      summary: Create a new brand
      tags:
        - Brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCreate"
      responses:
        201:
          description: Brand created successfully
        400:
          description: Validation error

    delete:
      summary: Bulk delete brands
      tags:
        - Brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  description: List of brand IDs to delete
      responses:
        200:
          description: Brands deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deleted_ids:
                    type: array
                    items:
                      type: integer
        400:
          description: Invalid request

  /brands/{id}:
    get:
      summary: Get brand by ID
      tags:
        - Brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Brand detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        404:
          description: Brand not found

    patch:
      summary: Partially update brand
      tags:
        - Brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        202:
          description: Brand updated successfully
        400:
          description: Validation error
        404:
          description: Brand not found

    put:
      summary: Fully update brand
      tags:
        - Brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        202:
          description: Brand updated successfully
        400:
          description: Validation error
        404:
          description: Brand not found

    delete:
      summary: Soft-delete single brand by ID
      tags:
        - Brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Brand deleted successfully
        404:
          description: Brand not found
